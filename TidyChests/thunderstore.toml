# Thunderstore publishing configuration for `tcli publish`.
# The package zip itself is produced by `dotnet build -c Release` (see TidyChests.csproj);
# tcli only uploads it. Run scripts/publish-thunderstore.sh TidyChests from the repository root.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "Muindor"
name = "TidyChests"
versionNumber = "1.1.0"
description = "Quick stack into nearby chests, a hotkey to find where an item is stored, Ctrl+O to search everything in the chests around you, and recipes that unlock from the materials your team mates store. Client-side."
websiteUrl = "https://github.com/egor-muindor/ValheimMods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./Package/icon.png"
readme = "./README.md"
outdir = "../dist/tcli"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "tweaks", "client-side", "ai-generated", "deep-north-update" ]
