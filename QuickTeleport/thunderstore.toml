# Thunderstore publishing configuration for `tcli publish`.
# The package zip itself is produced by `dotnet build -c Release` (see QuickTeleport.csproj);
# tcli only uploads it. Run scripts/publish-thunderstore.sh QuickTeleport from the repository root.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "Muindor"
name = "QuickTeleport"
versionNumber = "1.0.2"
description = "Faster portals and dungeon teleports: end the teleport as soon as the screen is black and the destination is loaded, or run vanilla timing N times faster. Client-side, Valheim 1.0."
websiteUrl = "https://github.com/egor-muindor/ValheimMods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./Package/icon.png"
readme = "./README.md"
outdir = "../dist/tcli"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "tweaks", "client-side", "ai-generated", "deep-north-update" ]
