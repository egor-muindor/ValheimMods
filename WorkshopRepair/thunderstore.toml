# Thunderstore publishing configuration for `tcli publish`.
# The package zip itself is produced by `dotnet build -c Release` (see WorkshopRepair.csproj);
# tcli only uploads it. Run scripts/publish-thunderstore.sh WorkshopRepair from the repository root.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "Muindor"
name = "WorkshopRepair"
versionNumber = "1.0.0"
description = "One click on the repair button mends all your gear, and a station also repairs what belongs to other stations within 30 m: fix bronze at the workbench if a forge is nearby. Client-side; a server can optionally enforce its config. Valheim 1.0."
websiteUrl = "https://github.com/egor-muindor/ValheimMods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./Package/icon.png"
readme = "./README.md"
outdir = "../dist/tcli"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "tweaks", "crafting", "client-side", "server-side", "ai-generated", "deep-north-update" ]
